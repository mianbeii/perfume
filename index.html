<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>香水分装</title>
<meta name="theme-color" content="#3d0a12">
<style>
/* —— 换季换皮：颜色都在这里，图片在 img/<皮肤名>/ ——
   现在是秋天的酒红（red）。以后加别的季节，复制一份这一段改颜色、换图片文件夹就行 */
:root{
  --bg:#3d0a12; --bg2:#5a121c;            /* 酒红底 */
  --gold:#dcb878; --gold2:#a8814a;         /* 香槟金：深底上用亮的，奶油纸上用深的 */
  --cream:#faecd3; --cream2:#f3e2c4;       /* 卡片奶油纸（和瓶子插画的纸色一样） */
  --ink:#3a1416; --soft:#7a5a4e; --line:rgba(168,129,74,.35);
  --on-bg:#f3e2c4; --on-bg-soft:rgba(243,226,196,.62);
  --serif:"ShopLatin","ShopKai","Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --sans:"ShopLatin","ShopKai",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
/* 字体打包在 fonts/：霞鹜文楷＋Cormorant Garamond。加了新香水要跑 字体.sh 补字 */
@font-face{font-family:"ShopKai";src:url(fonts/wenkai.woff2) format("woff2");font-display:swap}
@font-face{font-family:"ShopLatin";src:url(fonts/corm.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--on-bg);font-family:var(--sans);font-variant-numeric:lining-nums}
body{background:var(--bg) url(img/red/silk.jpg) center top/800px;min-height:100vh}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.orn{display:block;margin:0 auto;pointer-events:none;user-select:none}

/* —— 头图 —— */
/* 头图是 G老师连「一朵棉被」字一起画的整张图：手机竖版 hero-m，电脑横版 hero-d；
   代码里的大字只留给读屏和搜索，看不见 */
.hero{position:relative;background:var(--bg);border-bottom:1px solid var(--line)}
.hero-art{display:block;width:100%;max-height:640px;object-fit:cover;object-position:center 45%;
  -webkit-mask-image:linear-gradient(180deg,#000 88%,transparent);mask-image:linear-gradient(180deg,#000 88%,transparent)}
.hero .eyebrow,.hero h1,.hero .sub,.hero .div{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero-in{max-width:1120px;margin:0 auto;padding:2px 28px 22px;text-align:center}
.eyebrow{font-size:11px;letter-spacing:.42em;color:var(--gold);margin-bottom:16px}
.hero .tip{font-size:13.5px;color:var(--on-bg-soft);line-height:1.85;margin:0 auto;max-width:420px}
.xy{margin:12px auto 0;display:inline-block;font:inherit;font-size:13px;letter-spacing:.12em;color:var(--gold);background:rgba(0,0,0,.15);border:1px solid var(--gold2);border-radius:999px;padding:8px 22px;box-shadow:inset 0 0 0 3px rgba(52,8,15,.9),inset 0 0 0 4px rgba(220,184,120,.25);cursor:pointer}
.xy:active{background:var(--gold);color:var(--bg)}

/* —— 筛选 —— */
.bar{position:sticky;top:0;z-index:20;background:rgba(52,8,15,.9);backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:14px 20px 12px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--gold2);border-radius:999px;padding:9px 18px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 3px rgba(52,8,15,.9),inset 0 0 0 4px rgba(220,184,120,.25)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:14px;color:var(--on-bg)}
.search input::placeholder{color:var(--on-bg-soft);font-style:italic}
.search svg{flex:none;color:var(--gold)}
.fams{display:flex;gap:12px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.fams::-webkit-scrollbar{display:none}
.fam{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--on-bg-soft);width:60px;letter-spacing:.08em}
.fam i{width:56px;height:56px;border-radius:50%;background:var(--cream) center/80% no-repeat;background-blend-mode:multiply;box-shadow:0 0 0 1px var(--gold2),0 0 0 3px rgba(52,8,15,.9),0 0 0 4px rgba(220,184,120,.45);transition:.2s}
.fam i.all{display:grid;place-items:center;font-style:normal;font-family:var(--serif);font-size:15px;color:var(--ink)}
.fam.on{color:var(--gold)}
.fam.on i{box-shadow:0 0 0 1px var(--gold),0 0 0 3px rgba(52,8,15,.9),0 0 0 5px var(--gold),0 0 18px 4px rgba(220,184,120,.35)}
.row{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.pill{flex:none;font-size:12.5px;padding:5px 13px;border-radius:999px;border:1px solid var(--line);color:var(--on-bg-soft);transition:.15s;letter-spacing:.06em}
.pill.on{border-color:var(--gold);background:var(--gold);color:var(--bg)}
.sep{flex:none;width:1px;height:16px;background:var(--line);margin:0 4px}
.sort{flex:none;margin-left:auto;font-size:12.5px;color:var(--on-bg-soft);border:0;background:none;font-family:inherit;padding-right:2px}
.sort option{color:#333}

/* —— 列表 —— */
main{max-width:1120px;margin:0 auto;padding:22px 20px 40px}
.meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--on-bg-soft);margin:2px 4px 16px;letter-spacing:.08em}
.meta b{font-family:var(--serif);font-size:22px;color:var(--gold);font-weight:500;margin:0 4px}
.meta button{color:var(--gold);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

/* 卡片：手工纸＋G老师画的金框（九宫格拉伸）＋上下花饰 */
.card{position:relative;min-width:0;background:var(--cream) url(img/red/paper.jpg) center/260px;color:var(--ink);padding:18px 16px 18px;display:flex;flex-direction:column;cursor:pointer;
  box-shadow:0 0 0 1px var(--gold2),0 16px 30px -18px rgba(0,0,0,.7);animation:up .45s both;transition:transform .25s}
.card::before{content:"";position:absolute;inset:3px;border:28px solid transparent;border-image:url(img/red/frame.png) 120 / 28px stretch;pointer-events:none}
.card .fl{position:absolute;left:50%;width:58px;margin-left:-29px;pointer-events:none}
.fl.t{top:4px}.fl.b{bottom:4px;transform:scaleY(-1)}
.card:hover{transform:translateY(-3px)}
@media(max-width:640px){.card{padding:14px 12px 22px}.card::before{border-width:22px;border-image-width:22px}.card .fl{width:44px;margin-left:-22px}.brand{font-size:9.5px;letter-spacing:.14em}.name{font-size:16px}.en{font-size:12px}.card .div{width:84px;margin:6px auto 4px}.say{font-size:12.5px;line-height:1.6}.tagline{font-size:10.5px}.sizes-mini span{font-size:11px}.sizes-mini b{font-size:14.5px}.sizes-mini em{font-size:9.5px}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.pic{position:relative;display:grid;place-items:center}
.card .pic{margin:2px 4px 6px}
.pic img{width:100%;display:block;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent)}
.info{min-width:0;display:flex;flex-direction:column;flex:1;text-align:center;align-items:center}
.brand{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2)}
.name{font-family:var(--serif);font-size:19px;margin:5px 0 1px;line-height:1.3;color:var(--ink);word-break:keep-all}
.en{font-family:"ShopLatin",Georgia,serif;font-style:italic;font-size:13.5px;color:var(--soft)}
.card .div{width:110px;margin:8px auto 6px;filter:brightness(.72)}
.say{font-size:13.5px;color:#5a3a34;line-height:1.7;margin:0 0 4px;flex:1}
.tagline{font-size:11.5px;color:var(--soft);letter-spacing:.06em}
.sizes-mini{margin-top:10px;border-top:1px solid var(--line)}
.sizes-mini span{display:flex;justify-content:space-between;align-items:baseline;padding:5px 2px 3px;border-bottom:1px dashed var(--line);font-size:12px;color:var(--soft)}
.sizes-mini span:last-child{border-bottom:0}
.sizes-mini b{font-family:var(--serif);font-weight:500;font-size:16px;color:var(--ink)}
.sizes-mini em{font-style:normal;font-size:10.5px;color:var(--gold2);margin-left:2px}
.card .in{position:absolute;z-index:1;right:12px;top:12px;background:var(--cream);font-size:11px;color:var(--bg2);border:1px solid var(--bg2);border-radius:999px;padding:1px 8px}
.empty{text-align:center;color:var(--on-bg-soft);padding:60px 0;font-family:var(--serif)}

/* 横版卡片（照概念图）：左边画，右边字，价格三个小方块 */
.grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{display:grid;grid-template-columns:44% 1fr;grid-template-rows:1fr auto;column-gap:8px;padding:16px 16px 16px 12px}
.card .pic{grid-row:1/3;margin:0;align-self:center}
.card .info{text-align:left;align-self:start;padding-top:6px}
.card .div{display:none}
.card .en{margin-bottom:4px}
.say{font-size:12.5px;line-height:1.6;margin:2px 0 3px}
.tagline{font-size:10.5px}
.sizes-mini{display:flex;gap:5px;margin-top:8px;border-top:0}
.sizes-mini span{flex:1;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:0;border:1px solid var(--gold2);border-radius:5px;padding:3px 0 2px;font-size:10px;font-family:"ShopLatin",Georgia,serif;font-style:italic;line-height:1.3}
.sizes-mini span:last-child{border-bottom:1px solid var(--gold2)}
.sizes-mini b{font-size:14px;font-style:normal;white-space:nowrap}
.sizes-mini em{display:block;text-align:center;font-size:9px;margin:0;line-height:1.1}
.card .in{right:auto;left:12px;top:12px}
.card .fl{display:none}
.card .info{align-items:flex-start}.card .info>*{text-align:left}
@media(max-width:640px){
  .grid{grid-template-columns:1fr;gap:10px}
  .card{padding:14px 16px 14px 10px;grid-template-columns:40% 1fr}
  .name{font-size:17px}.say{font-size:12.5px}
}

/* —— 底部小样盒介绍 —— */
.boxsec{max-width:1120px;margin:10px auto 0;padding:0 20px}
.boxcard{position:relative;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;min-height:230px;background:var(--bg) url(img/red/box.jpg) left center/cover no-repeat;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.boxcard::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(45,6,12,0) 30%,rgba(45,6,12,.85) 62%)}
.boxtext{grid-column:2;position:relative;text-align:center;padding:26px 16px}
.boxtext .eyebrow{margin-bottom:8px}
.boxtext h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0;color:var(--gold);letter-spacing:.2em}
.boxtext p{font-size:13px;color:var(--on-bg-soft);line-height:1.85;margin:10px 0 0}
@media(max-width:640px){.boxcard{grid-template-columns:1fr;min-height:0;background-size:auto 100%;background-position:left center}.boxcard::before{background:linear-gradient(90deg,rgba(45,6,12,.25),rgba(45,6,12,.9) 55%)}.boxtext{grid-column:1;margin-left:38%;padding:24px 10px}}
footer{text-align:center;font-size:11.5px;color:var(--on-bg-soft);letter-spacing:.12em;padding:26px 20px calc(160px + env(safe-area-inset-bottom));line-height:2}
footer .orn{width:150px;margin-bottom:10px;opacity:.85}

/* —— 弹层 —— */
.mask{position:fixed;inset:0;background:rgba(20,2,6,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;left:50%;bottom:0;width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--cream);color:var(--ink);border-radius:22px 22px 0 0;transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:0 0 calc(40px + env(safe-area-inset-bottom));border-top:3px double var(--gold2)}
.sheet.show{transform:translate(-50%,0)}
@media(min-width:700px){.sheet{bottom:50%;border-radius:4px;border:1px solid var(--gold2);outline:1px solid var(--line);outline-offset:-7px;transform:translate(-50%,60%);opacity:0;transition:.3s}.sheet.show{transform:translate(-50%,50%);opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 0}
.x{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;font-size:22px;color:var(--soft)}
.d-top{display:flex;gap:14px;align-items:center;padding:16px 24px 4px}
.d-top .pic{width:120px;flex:none}
.d-top .name{font-size:23px}
.quote{font-family:var(--serif);font-size:15px;color:#5a3a34;margin:12px 24px 4px;padding:12px 16px;background:var(--cream2);border-left:2px solid var(--gold2);line-height:1.75}
.notes{margin:14px 24px 0}
.note{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.6}
.note:last-child{border:0}
.note span{font-size:12px;color:var(--gold2);letter-spacing:.1em;padding-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 24px 0}
.tag{font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--soft)}
.h{font-size:12px;letter-spacing:.2em;color:var(--soft);margin:22px 24px 10px}
.sizes{display:flex;gap:10px;margin:0 24px}
.size{flex:1;border:1px solid var(--line);padding:10px 0;text-align:center;transition:.15s;background:rgba(255,255,255,.35)}
.size b{display:block;font-family:var(--serif);font-weight:500;font-size:17px}
.size em{font-style:normal;font-size:12px;color:var(--soft)}
.size.on{border-color:var(--bg2);background:var(--bg2);color:var(--cream)}
.size.on em{color:rgba(250,236,211,.75)}
.acts{display:flex;gap:10px;margin:22px 24px 0}
.btn{flex:1;height:48px;border-radius:999px;font-size:15px;letter-spacing:.08em}
.btn.dark{background:var(--bg2);color:var(--cream);box-shadow:inset 0 0 0 1px var(--gold2)}
.btn.line{border:1px solid var(--bg2);color:var(--bg2)}

/* —— 小样盒 —— */
.bag{position:fixed;z-index:30;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translate(-50%,200%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:12px;background:var(--bg2);color:var(--on-bg);border-radius:999px;padding:7px 7px 7px 20px;box-shadow:0 0 0 1px var(--gold2),0 14px 30px -10px rgba(0,0,0,.6);white-space:nowrap}
.bag.show{transform:translate(-50%,0)}
/* 微信内置浏览器底部有一条前进后退栏，会挡住贴底的东西，所以购物车和弹层底部比贴底多让出一截（她 1026 试过 64px 太高、16px 被挡） */
.bag .n{font-family:var(--serif);font-size:15px;letter-spacing:.06em}
.bag .n small{color:var(--gold);font-size:13px;margin-left:8px}
.bag button{background:var(--gold);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:13.5px}
.bag-list{margin:6px 24px 0}
.bi{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.bi .pic{width:54px;flex:none}
.bi .t{flex:1;min-width:0}
.bi .t b{font-family:var(--serif);font-weight:500;font-size:15px}
.bi .t div{font-size:12px;color:var(--soft);margin-top:2px}
.bi .p{font-family:var(--serif);font-size:16px}
.bi .rm{color:var(--soft);font-size:18px;width:28px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 24px 0;font-size:13px;color:var(--soft)}
.total b{font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:500}
.hint{font-size:12px;color:var(--soft);text-align:center;margin:12px 24px 0;line-height:1.7}

.toast{position:fixed;z-index:60;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);background:rgba(45,6,12,.94);color:var(--on-bg);box-shadow:0 0 0 1px var(--gold2);font-size:14px;padding:14px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;text-align:center;line-height:1.7;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<header class="hero">
  <img class="hero-art" src="img/red/hero-d.jpg" alt="一朵棉被的香水小店">
  <div class="hero-in">
    <div class="eyebrow">PERFUME · DECANTS</div>
    <h1 id="shopName"></h1>
    <div class="sub" id="shopSub"></div>
    <img class="orn div" src="img/red/divider.png" alt="">
    <div class="tip" id="shopTip"></div>
    <button class="xy" id="xyBtn" type="button">复制闲鱼链接 · 去我的小店</button>
  </div>
</header>

<div class="bar"><div class="bar-in">
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜品牌、香名、或一种味道，比如「玫瑰」">
  </label>
  <div class="fams" id="fams"></div>
  <div class="row" id="row"></div>
</div></div>

<main>
  <div class="meta"><span>共<b id="count">0</b>款</span><button id="reset" hidden>清除筛选</button></div>
  <div class="grid" id="grid"></div>
</main>

<section class="boxsec"><div class="boxcard"><div class="boxtext">
  <div class="eyebrow">THE SAMPLE BOX</div>
  <h2>小样盒</h2>
  <p>看中了就点开放进小样盒<br>挑几支一起，复制清单回闲鱼发我</p>
</div></div></section>

<footer><img class="orn" src="img/red/fan.png" alt="">分装为原瓶手工分出 · 小样仅供试香<br>价格以闲鱼为准</footer>

<div class="bag" id="bag"><span class="n" id="bagN"></span><button id="bagOpen">看看小样盒</button></div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const SKIN = 'red'; // 换季换皮：图片在 img/<SKIN>/
const FAM = {
  floral: { label: '花香' }, citrus: { label: '柑橘' }, woody: { label: '木质' },
  sweet: { label: '甜香' }, fresh: { label: '清新' }, amber: { label: '琥珀' },
};
const $ = s => document.querySelector(s);
const st = { fam: '', gender: '', season: '', sort: '', q: '' };
let bag = JSON.parse(localStorage.getItem('decant-bag') || '[]');
const byId = id => PERFUMES.find(p => p.id === id);
const minPrice = p => Math.min(...p.sizes.map(s => s.price));
const free = s => s.free ? ' 包邮' : '';
const pic = p => `<div class="pic"><img src="img/${p.pic || SKIN + '/b-' + p.family + '.jpg'}" alt=""></div>`;
const corners = ['t', 'b'].map(c => `<img class="fl ${c}" src="img/${SKIN}/fleuron.png" alt="">`).join('');

$('#shopName').textContent = SHOP.name;
$('#shopSub').textContent = SHOP.sub;
$('#shopTip').textContent = SHOP.tip;
$('#xyBtn').onclick = () => SHOP.xianyu
  ? copy(SHOP.xianyu, '闲鱼链接已复制 ✓<br>打开闲鱼 App，会弹出来带你到我的小店', 3200)
  : toast('闲鱼链接还没填好，先在闲鱼搜我吧');
document.title = SHOP.name + SHOP.sub;

// 香调（小圆图用手绘水彩）
$('#fams').innerHTML = `<button class="fam on" data-f=""><i class="all"><em style="font-family:ShopLatin,Georgia,serif;font-size:17px">All</em></i>全部</button>` +
  Object.entries(FAM).map(([k, v]) => `<button class="fam" data-f="${k}"><i style="background-image:url(img/${k}.jpg)"></i>${v.label}</button>`).join('');
$('#fams').onclick = e => { const b = e.target.closest('.fam'); if (!b) return; st.fam = b.dataset.f; render(); };

// 性别、季节、排序
const G = ['女', '男', '中性'], S = ['春', '夏', '秋', '冬'];
$('#row').innerHTML =
  G.map(g => `<button class="pill" data-k="gender" data-v="${g}">${g === '中性' ? '中性' : g + '香'}</button>`).join('') +
  `<span class="sep"></span>` +
  S.map(s => `<button class="pill" data-k="season" data-v="${s}">${s}</button>`).join('') +
  `<select class="sort" id="sort"><option value="">默认排序</option><option value="up">价格从低到高</option><option value="down">价格从高到低</option></select>`;
$('#row').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; const k = b.dataset.k; st[k] = st[k] === b.dataset.v ? '' : b.dataset.v; render(); };
$('#sort').onchange = e => { st.sort = e.target.value; render(); };
$('#q').oninput = e => { st.q = e.target.value.trim().toLowerCase(); render(); };
$('#reset').onclick = () => { Object.assign(st, { fam: '', gender: '', season: '', q: '' }); $('#q').value = ''; render(); };

function list() {
  let r = PERFUMES.filter(p =>
    (!st.fam || p.family === st.fam) &&
    (!st.gender || p.gender === st.gender) &&
    (!st.season || p.season.includes(st.season)) &&
    (!st.q || [p.brand, p.name, p.en, p.say, p.top, p.heart, p.base, FAM[p.family].label].join(' ').toLowerCase().includes(st.q)));
  if (st.sort) r = [...r].sort((a, b) => (minPrice(a) - minPrice(b)) * (st.sort === 'up' ? 1 : -1));
  return r;
}

function render() {
  document.querySelectorAll('.fam').forEach(b => b.classList.toggle('on', b.dataset.f === st.fam));
  document.querySelectorAll('.pill').forEach(b => b.classList.toggle('on', st[b.dataset.k] === b.dataset.v));
  const r = list();
  $('#count').textContent = r.length;
  $('#reset').hidden = !(st.fam || st.gender || st.season || st.q);
  $('#grid').innerHTML = r.length ? r.map((p, i) => `
    <article class="card" data-id="${p.id}" style="animation-delay:${Math.min(i, 12) * 40}ms">${corners}
      ${bag.some(x => x.id === p.id) ? '<span class="in">已在小样盒</span>' : ''}
      ${pic(p)}
      <div class="info">
        <div class="brand">${p.brand}</div>
        <div class="name">${p.name}</div>
        <div class="en">${p.en}</div>
        <img class="div" src="img/${SKIN}/divider.png" alt="">
        <div class="say">${p.say}</div>
        <div class="tagline">${FAM[p.family].label} · ${p.gender === '中性' ? '中性' : p.gender + '香'} · ${p.season.join('')}</div>
      </div>
      <div class="sizes-mini">${p.sizes.map(s => `<span>${s.ml}ml<b>¥${s.price}${s.free ? '<em>包邮</em>' : ''}</b></span>`).join('')}</div>
    </article>`).join('') : `<div class="empty" style="grid-column:1/-1">没有找到合适的，换个条件试试</div>`;
  renderBag();
}

$('#grid').onclick = e => { const c = e.target.closest('.card'); if (c) openDetail(c.dataset.id); };

// 详情
let cur = null, curSize = 0;
function openDetail(id) {
  cur = byId(id); curSize = Math.min(1, cur.sizes.length - 1);
  const p = cur;
  $('#sheet').innerHTML = `
    <div class="grab"></div><button class="x" data-close>×</button>
    <div class="d-top">${pic(p)}<div><div class="brand">${p.brand} · ${p.id}</div><div class="name">${p.name}</div><div class="en">${p.en}</div></div></div>
    <div class="quote">${p.say}</div>
    <div class="tags"><span class="tag">${FAM[p.family].label}</span><span class="tag">${p.gender === '中性' ? '中性' : p.gender + '香'}</span>${p.season.map(s => `<span class="tag">${s}</span>`).join('')}</div>
    <div class="notes">
      <div class="note"><span>前调</span><div>${p.top}</div></div>
      <div class="note"><span>中调</span><div>${p.heart}</div></div>
      <div class="note"><span>后调</span><div>${p.base}</div></div>
    </div>
    <div class="h">选择分装规格</div>
    <div class="sizes">${p.sizes.map((s, i) => `<button class="size ${i === curSize ? 'on' : ''}" data-size="${i}"><b>${s.ml}ml</b><em>¥${s.price}${free(s)}</em></button>`).join('')}</div>
    <div class="acts"><button class="btn line" data-copy1>复制这一款</button><button class="btn dark" data-put>加入小样盒</button></div>`;
  open();
}

// 小样盒
function saveBag() { localStorage.setItem('decant-bag', JSON.stringify(bag)); }
function bagTotal() { return bag.reduce((t, x) => t + byId(x.id).sizes[x.s].price, 0); }
function line(x, i) { const p = byId(x.id), s = p.sizes[x.s]; return `${i + 1}. ${p.id} ${p.brand} ${p.name} · ${s.ml}ml ¥${s.price}${free(s)}`; }
function renderBag() {
  bag = bag.filter(x => byId(x.id) && byId(x.id).sizes[x.s]);
  $('#bag').classList.toggle('show', bag.length > 0);
  $('#bagN').innerHTML = `小样盒 ${bag.length} 件<small>¥${bagTotal()}</small>`;
}
function openBag() {
  if (!bag.length) { close(); return; }
  $('#sheet').innerHTML = `
    <div class="grab"></div><button class="x" data-close>×</button>
    <div class="d-top"><div><div class="brand">MY SAMPLE BOX</div><div class="name">我的小样盒</div></div></div>
    <div class="bag-list">${bag.map((x, i) => { const p = byId(x.id), s = p.sizes[x.s]; return `
      <div class="bi">${pic(p)}<div class="t"><b>${p.name}</b><div>${p.brand} · ${p.id} · ${s.ml}ml${free(s)}</div></div><span class="p">¥${s.price}</span><button class="rm" data-rm="${i}">×</button></div>`; }).join('')}</div>
    <div class="total"><span>共 ${bag.length} 件</span><span>合计 <b>¥${bagTotal()}</b></span></div>
    <div class="acts"><button class="btn dark" data-copyall>复制清单</button></div>
    <div class="hint">复制后回到闲鱼，粘贴发给我<br>我按清单改好价格，你再拍下就好</div>`;
  open();
}
$('#bagOpen').onclick = openBag;

$('#sheet').onclick = e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-close')) close();
  else if (t.dataset.size) { curSize = +t.dataset.size; document.querySelectorAll('.size').forEach((b, i) => b.classList.toggle('on', i === curSize)); }
  else if (t.hasAttribute('data-put')) {
    const k = bag.findIndex(x => x.id === cur.id && x.s === curSize);
    if (k < 0) bag.push({ id: cur.id, s: curSize });
    saveBag(); render(); close(); toast(k < 0 ? '已放进小样盒' : '小样盒里已经有这一支啦');
  }
  else if (t.hasAttribute('data-copy1')) { const s = cur.sizes[curSize]; copy(`你好～我想要：${cur.id} ${cur.brand} ${cur.name} · ${s.ml}ml ¥${s.price}${free(s)}`); }
  else if (t.dataset.rm) { bag.splice(+t.dataset.rm, 1); saveBag(); render(); openBag(); }
  else if (t.hasAttribute('data-copyall')) copy(`你好～我想要这些：\n${bag.map(line).join('\n')}\n合计 ¥${bagTotal()}`);
};

function open() { $('#mask').classList.add('show'); $('#sheet').classList.add('show'); document.body.classList.add('lock'); }
function close() { $('#mask').classList.remove('show'); $('#sheet').classList.remove('show'); document.body.classList.remove('lock'); }
$('#mask').onclick = close;
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

function copy(text, msg = '已复制 ✓<br>回闲鱼粘贴发给我就好', ms) {
  const ok = () => toast(msg, ms);
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (_) { toast('复制没成功，长按手动复制吧'); } ta.remove(); };
  navigator.clipboard ? navigator.clipboard.writeText(text).then(ok, fallback) : fallback();
}
let tt;
function toast(h, ms = 1800) { const el = $('#toast'); el.innerHTML = h; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), ms); }

render();
</script>
</body>
</html>
