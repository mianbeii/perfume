<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>香水分装</title>
<meta name="theme-color" content="#fbf7ef">
<style>
/* —— 法式轻奢（1028 换）：奶白＋香槟金。颜色都在这里，图片在 img/fr/ —— */
:root{
  --bg:#fbf7ef; --bg2:#8a6d43;             /* 奶白底；选中、按钮用深香槟金 */
  --gold:#b39463; --gold2:#a8895c;         /* 香槟金 */
  --cream:#fffbf4; --cream2:#f4ecdd;       /* 弹层、引言底 */
  --ink:#4a3826; --soft:#9c8a72; --line:rgba(179,148,99,.32);
  --on-bg:#5a4630; --on-bg-soft:#9c8a72;
  --serif:"ShopLatin","ShopKai","Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --sans:"ShopLatin","ShopKai",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
/* 字体打包在 fonts/：霞鹜文楷＋Cormorant Garamond。加了新香水要跑 字体.sh 补字 */
@font-face{font-family:"ShopKai";src:url(fonts/wenkai.woff2) format("woff2");font-display:swap}
@font-face{font-family:"ShopLatin";src:url(fonts/corm.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--on-bg);font-family:var(--sans);font-variant-numeric:lining-nums}
body{background:var(--bg);min-height:100vh}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.orn{display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto;padding:0 30px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--line)}
.orn i{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);opacity:.7}

/* —— 头图：丝绸底＋棉花＋会晃的瓶子（瓶子刻着 Mianbei Parfum，是 G老师连字一起画的） —— */
.top{text-align:center;padding:26px 0 0;position:relative;z-index:3}
.top h1{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:.42em;padding-left:.42em;color:var(--bg2)}
.top .sub{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;font-size:13px;letter-spacing:.5em;padding-left:.5em;color:var(--soft)}
.top .sub::before,.top .sub::after{content:"";width:42px;height:1px;background:var(--line)}
.hero{position:relative;height:min(118vw,560px);margin-top:-70px;overflow:hidden;touch-action:pan-y}
.silk{position:absolute;inset:-20px;background:url(img/fr/silk.jpg) center 60%/cover no-repeat;will-change:transform}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,var(--bg))}
.cotton{position:absolute;left:50%;bottom:calc(9% - 14px);width:min(124vw,680px);aspect-ratio:1300/420;
  background:url(img/fr/cotton.jpg) center/100% 100% no-repeat;mix-blend-mode:multiply;filter:blur(.5px);opacity:.9;
  -webkit-mask-image:linear-gradient(transparent,#000 14%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 90%,transparent);
  transform:translateX(-50%);z-index:1;will-change:transform}
/* 瓶子是白底图，multiply 把白混掉；得加在 .stage 上，加在 img 上会被 transform 隔开 */
.stage{position:absolute;left:50%;bottom:9%;width:min(52vw,250px);transform:translateX(-50%);z-index:2;mix-blend-mode:multiply}
@media (max-width:600px){.cotton{width:104vw}.stage{width:47vw}}
.shadow{position:absolute;left:12%;right:12%;bottom:-6px;height:22px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(120,90,40,.28),transparent 70%);will-change:transform}
.bottle{display:block;width:100%;transform-origin:50% 96%;will-change:transform;cursor:grab;user-select:none;-webkit-user-drag:none;touch-action:pan-y}
.bottle.dragging{cursor:grabbing}
.nudge{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-size:12px;letter-spacing:.3em;color:var(--soft);z-index:3;transition:opacity .8s}
.nudge.gone{opacity:0}
.hero-in{max-width:1120px;margin:0 auto;padding:4px 28px 24px;text-align:center}
.hero-in .tip{font-size:13px;color:var(--on-bg-soft);line-height:1.9;letter-spacing:.06em;margin:0 auto;max-width:420px}
.xy{margin:14px auto 0;display:inline-block;font:inherit;font-size:13px;letter-spacing:.12em;color:var(--bg2);background:rgba(255,255,255,.5);border:1px solid var(--gold);border-radius:999px;padding:8px 22px;cursor:pointer}
.xy:active{background:var(--bg2);color:var(--cream)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.btns .xy{margin:0}
.xy.cp{background:linear-gradient(90deg,#9d7d4f,#b39463);color:#fff;border-color:transparent}
.xy.cp.got{background:rgba(255,255,255,.5);color:var(--bg2);border:1px dashed var(--gold)}

/* —— 筛选 —— */
.bar{position:sticky;top:0;z-index:20;background:rgba(251,247,239,.88);backdrop-filter:saturate(1.2) blur(12px);-webkit-backdrop-filter:saturate(1.2) blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:14px 20px 12px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:9px 18px;background:rgba(255,255,255,.6)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--on-bg-soft);font-style:italic}
.search svg{flex:none;color:var(--gold)}
.fams{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;justify-content:safe center}
.fams::-webkit-scrollbar{display:none}
.fam{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--on-bg-soft);width:58px;letter-spacing:.1em}
.fam i{width:52px;height:52px;border-radius:50%;background:#fff center/cover no-repeat;background-blend-mode:multiply;border:1px solid transparent;transition:.25s}
.fam i.all{display:grid;place-items:center;font-style:normal;font-family:var(--serif);font-size:15px;color:var(--bg2);background:var(--cream2)}
.fam.on{color:var(--bg2)}
.fam.on i{border-color:var(--gold);box-shadow:0 0 0 3px rgba(179,148,99,.15)}
.row{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.pill{flex:none;font-size:12.5px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);color:var(--on-bg-soft);transition:.15s;letter-spacing:.08em;background:rgba(255,255,255,.4)}
.pill.on{border-color:var(--gold);background:var(--gold);color:#fff}
.sep{flex:none;width:1px;height:16px;background:var(--line);margin:0 4px}
.sort{flex:none;margin-left:auto;font-size:12.5px;color:var(--on-bg-soft);border:0;background:none;font-family:inherit;padding-right:2px}
.sort option{color:#333}

/* —— 列表：横版卡片，左边画、右边字，价格小方块 —— */
main{max-width:1120px;margin:0 auto;padding:22px 16px 40px}
.meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--on-bg-soft);margin:2px 4px 16px;letter-spacing:.08em}
.meta b{font-family:var(--serif);font-size:22px;color:var(--bg2);font-weight:500;margin:0 4px}
.meta button{color:var(--bg2);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr;gap:12px}}
.card{position:relative;min-width:0;display:grid;grid-template-columns:40% 1fr;grid-template-rows:1fr auto;column-gap:12px;
  background:rgba(255,255,255,.62);border:1px solid rgba(179,148,99,.18);border-radius:18px;padding:12px;color:var(--ink);cursor:pointer;
  box-shadow:0 6px 24px rgba(150,120,70,.07);animation:up .45s both;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(150,120,70,.12)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.pic{position:relative;display:grid;place-items:center}
.card .pic{grid-row:1/3;margin:0;align-self:center}
.pic img{width:100%;display:block;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent)}
.info{min-width:0;display:flex;flex-direction:column;flex:1}
.card .info{align-self:start;padding-top:6px}
.brand{font-size:11px;letter-spacing:.14em;color:var(--soft)}
.name{font-family:var(--serif);font-size:18px;margin:3px 0 1px;line-height:1.3;color:var(--ink);letter-spacing:.04em}
.en{font-family:"ShopLatin",Georgia,serif;font-style:italic;font-size:12.5px;color:var(--soft);margin-bottom:4px}
.say{font-size:12.5px;color:#7d6a52;line-height:1.7;margin:2px 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tagline{font-size:10.5px;color:var(--soft);letter-spacing:.06em}
.sizes-mini{display:flex;gap:6px;margin-top:8px}
.sizes-mini span{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:4px 0 3px;font-size:10.5px;color:var(--soft);font-family:"ShopLatin",Georgia,serif;line-height:1.3}
.sizes-mini b{font-family:var(--serif);font-weight:400;font-size:14.5px;color:var(--ink);white-space:nowrap}
.sizes-mini em{display:block;text-align:center;font-style:normal;font-size:9.5px;color:var(--gold);line-height:1.1}
.card .in{position:absolute;z-index:1;left:12px;top:12px;background:var(--cream);font-size:11px;color:var(--bg2);border:1px solid var(--gold);border-radius:999px;padding:1px 8px}
.empty{text-align:center;color:var(--on-bg-soft);padding:60px 0;font-family:var(--serif)}

/* —— 底部小样盒介绍 —— */
.boxsec{max-width:560px;margin:16px auto 0;padding:0 20px;text-align:center}
.boxsec .eyebrow{font-family:"ShopLatin",Georgia,serif;font-size:11px;letter-spacing:.42em;color:var(--gold);margin:22px 0 8px}
.boxsec h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;color:var(--bg2);letter-spacing:.3em;padding-left:.3em}
.boxsec p{font-size:13px;color:var(--on-bg-soft);line-height:1.9;margin:10px 0 0}
footer{text-align:center;font-size:11.5px;color:var(--on-bg-soft);letter-spacing:.12em;padding:30px 20px calc(160px + env(safe-area-inset-bottom));line-height:2}
footer .orn{margin-bottom:12px}

/* —— 弹层 —— */
.mask{position:fixed;inset:0;background:rgba(90,70,40,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;left:50%;bottom:0;width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--cream);color:var(--ink);border-radius:24px 24px 0 0;transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:0 0 calc(40px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(120,90,40,.15)}
.sheet.show{transform:translate(-50%,0)}
@media(min-width:700px){.sheet{bottom:50%;border-radius:22px;border:1px solid var(--line);transform:translate(-50%,60%);opacity:0;transition:.3s}.sheet.show{transform:translate(-50%,50%);opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 0}
.x{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;font-size:22px;color:var(--soft)}
.d-top{display:flex;gap:14px;align-items:center;padding:16px 24px 4px}
.d-top .pic{width:120px;flex:none}
.d-top .name{font-size:23px}
.quote{font-family:var(--serif);font-size:15px;color:#6b5638;margin:12px 24px 4px;padding:12px 16px;background:var(--cream2);border-left:2px solid var(--gold);line-height:1.75;border-radius:0 10px 10px 0}
.notes{margin:14px 24px 0}
.note{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.6}
.note:last-child{border:0}
.note span{font-size:12px;color:var(--gold);letter-spacing:.1em;padding-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 24px 0}
.tag{font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--soft)}
.h{font-size:12px;letter-spacing:.2em;color:var(--soft);margin:22px 24px 10px}
.sizes{display:flex;gap:10px;margin:0 24px}
.size{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 0;text-align:center;transition:.15s;background:rgba(255,255,255,.6)}
.size b{display:block;font-family:var(--serif);font-weight:500;font-size:17px}
.size em{font-style:normal;font-size:12px;color:var(--soft)}
.size.on{border-color:var(--bg2);background:var(--bg2);color:var(--cream)}
.size.on em{color:rgba(255,251,244,.8)}
.acts{display:flex;gap:10px;margin:22px 24px 0}
.btn{flex:1;height:48px;border-radius:999px;font-size:15px;letter-spacing:.1em}
.btn.dark{background:linear-gradient(90deg,#9d7d4f,#b39463);color:#fff;box-shadow:0 6px 16px rgba(140,110,60,.25)}
.btn.line{border:1px solid var(--gold);color:var(--bg2)}

/* —— 小样盒 —— */
.bag{position:fixed;z-index:30;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translate(-50%,200%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:12px;
  background:linear-gradient(90deg,#efe3cc,#f8f1e4 55%,#ecdfc6);color:var(--bg2);border:1px solid rgba(179,148,99,.35);border-radius:999px;padding:7px 7px 7px 22px;box-shadow:0 8px 26px rgba(140,110,60,.2);white-space:nowrap}
.bag.show{transform:translate(-50%,0)}
/* 微信内置浏览器底部有一条前进后退栏，会挡住贴底的东西，所以购物车和弹层底部比贴底多让出一截（她 1026 试过 64px 太高、16px 被挡） */
.bag .n{font-family:var(--serif);font-size:15px;letter-spacing:.2em}
.bag .n small{color:var(--soft);font-size:13px;margin-left:6px;letter-spacing:.04em}
.bag button{background:var(--bg2);color:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;letter-spacing:.08em}
.bag-list{margin:6px 24px 0}
.bi{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.bi .pic{width:54px;flex:none}
.bi .t{flex:1;min-width:0}
.bi .t b{font-family:var(--serif);font-weight:500;font-size:15px}
.bi .t div{font-size:12px;color:var(--soft);margin-top:2px}
.bi .p{font-family:var(--serif);font-size:16px}
.bi .rm{color:var(--soft);font-size:18px;width:28px}
.cp-row{display:flex;justify-content:space-between;align-items:center;margin:14px 24px 0;padding:10px 14px;border:1px dashed var(--gold);border-radius:12px;font-size:13px;color:var(--bg2);background:rgba(255,255,255,.5)}
.cp-row b{font-family:var(--serif);font-weight:500;font-size:16px}
.cp-row button{background:var(--bg2);color:#fff;border-radius:999px;padding:5px 14px;font-size:12.5px}
.cp-row.dim{color:var(--soft)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 24px 0;font-size:13px;color:var(--soft)}
.total b{font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:500}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 24px}
.pk{border:1px solid var(--line);border-radius:999px;padding:7px 0;font-size:13px;text-align:center;background:rgba(255,255,255,.6);transition:.15s}
.pk.on{border-color:var(--bg2);background:var(--bg2);color:var(--cream)}
.pk:disabled{opacity:.35}
.h b{color:var(--bg2);font-weight:500;margin-left:6px}
.h b.ok{color:#5e8a5a}
.mix{margin:12px 24px 0;border-top:1px dashed var(--line)}
.mx{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.mx span{display:flex;align-items:center;gap:10px}
.mx button{width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);font-size:16px;line-height:1;color:var(--bg2)}
.mx button:disabled{opacity:.3}
.mx b{min-width:38px;text-align:center;font-family:var(--serif);font-weight:500}
@media(max-width:400px){.picks{grid-template-columns:repeat(3,1fr)}}
.hint{font-size:12px;color:var(--soft);text-align:center;margin:12px 24px 0;line-height:1.7}

.toast{position:fixed;z-index:60;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);background:rgba(74,56,38,.92);color:#fbf7ef;font-size:14px;padding:14px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;text-align:center;line-height:1.7;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<header class="top">
  <h1 id="shopName"></h1>
  <div class="sub" id="shopSub"></div>
</header>
<section class="hero" id="hero">
  <div class="silk" id="silk"></div>
  <div class="cotton" id="cotton"></div>
  <div class="stage">
    <div class="shadow" id="shadow"></div>
    <img class="bottle" id="bottle" src="img/fr/bottle.jpg" alt="Mianbei Parfum 香水瓶" draggable="false">
  </div>
  <div class="nudge" id="nudge">‹ 拨 一 下 瓶 子 ›</div>
</section>
<div class="hero-in">
  <div class="tip" id="shopTip"></div>
  <div class="btns"><button class="xy" id="xyBtn" type="button">复制闲鱼链接 · 去我的小店</button><button class="xy cp" id="cpBtn" type="button" hidden></button></div>
</div>

<div class="bar"><div class="bar-in">
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜品牌、香名、或一种味道，比如「玫瑰」">
  </label>
  <div class="fams" id="fams"></div>
  <div class="row" id="row"></div>
</div></div>

<main>
  <div class="meta"><span>共<b id="count">0</b>款</span><button id="reset" hidden>清除筛选</button></div>
  <div class="grid" id="grid"></div>
</main>

<section class="boxsec">
  <div class="orn"><i></i></div>
  <div class="eyebrow">THE SAMPLE BOX</div>
  <h2>小样盒</h2>
  <p>看中了就点开放进小样盒<br>挑几支一起，复制清单回闲鱼发我</p>
</section>

<footer><div class="orn"><i></i></div>分装为原瓶手工分出 · 小样仅供试香<br>价格以闲鱼为准</footer>

<div class="bag" id="bag"><span class="n" id="bagN"></span><button id="bagOpen">看看小样盒</button></div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const SKIN = 'red'; // 没有自己手绘图的香水，用 img/red/ 里的香调通用瓶
const FAM = {
  floral: { label: '花香' }, citrus: { label: '柑橘' }, woody: { label: '木质' },
  sweet: { label: '甜香' }, fresh: { label: '清新' }, amber: { label: '琥珀' },
};
const $ = s => document.querySelector(s);
const st = { fam: '', gender: '', season: '', sort: '', q: '' };
let bag = JSON.parse(localStorage.getItem('decant-bag') || '[]');
const byId = id => PERFUMES.find(p => p.id === id);
const minPrice = p => Math.min(...p.sizes.map(s => s.price));
const free = s => s.free ? ' 包邮' : '';
const picked = (x, s) => !x.pick || !x.pick.length ? '' : s.mix ? `（${x.pick.map(k => `${k.n} ${k.ml}ml`).join('、')}）` : ` · ${x.pick[0].n}`;
const mlSum = a => a.reduce((t, k) => t + k.ml, 0);
const pic = p => `<div class="pic"><img src="img/${p.pic || SKIN + '/b-' + p.family + '.jpg'}" alt=""></div>`;


$('#shopName').textContent = SHOP.name;
$('#shopSub').textContent = SHOP.sub;
$('#shopTip').textContent = SHOP.tip;
$('#xyBtn').onclick = () => SHOP.xianyu
  ? copy(SHOP.xianyu, '闲鱼链接已复制 ✓<br>打开闲鱼 App，会弹出来带你到我的小店', 3200)
  : toast('闲鱼链接还没填好，先在闲鱼搜我吧');
document.title = SHOP.name + SHOP.sub;

// 优惠券：满 min 减 off。领了记在这台手机上，小样盒合计和复制清单自动减
const CP = SHOP.coupon;
let cpGot = localStorage.getItem('decant-coupon') === '1';
const cpName = () => `满${CP.min}减${CP.off}`;
const cpOff = () => CP && cpGot && bagTotal() >= CP.min ? CP.off : 0;
function drawCp() {
  const b = $('#cpBtn'); b.hidden = !CP; if (!CP) return;
  b.textContent = cpGot ? `已领优惠券 · ${cpName()}` : `领优惠券 · ${cpName()}`;
  b.classList.toggle('got', cpGot);
}
function claimCp() {
  if (cpGot) { toast(`优惠券已经领过啦<br>小样盒满 ¥${CP.min} 自动减 ¥${CP.off}`, 2400); return; }
  cpGot = true; localStorage.setItem('decant-coupon', '1'); drawCp(); renderBag();
  toast(`领到一张${cpName()}的优惠券<br>小样盒满 ¥${CP.min} 自动减 ¥${CP.off}`, 2600);
}
$('#cpBtn').onclick = claimCp;

// 香调（小圆图用手绘水彩）
$('#fams').innerHTML = `<button class="fam on" data-f=""><i class="all">全</i>全部</button>` +
  Object.entries(FAM).map(([k, v]) => `<button class="fam" data-f="${k}"><i style="background-image:url(img/${k}.jpg)"></i>${v.label}</button>`).join('');
$('#fams').onclick = e => { const b = e.target.closest('.fam'); if (!b) return; st.fam = b.dataset.f; render(); };

// 性别、季节、排序
const G = ['女', '男', '中性'], S = ['春', '夏', '秋', '冬'];
$('#row').innerHTML =
  G.map(g => `<button class="pill" data-k="gender" data-v="${g}">${g === '中性' ? '中性' : g + '香'}</button>`).join('') +
  `<span class="sep"></span>` +
  S.map(s => `<button class="pill" data-k="season" data-v="${s}">${s}</button>`).join('') +
  `<select class="sort" id="sort"><option value="">默认排序</option><option value="up">价格从低到高</option><option value="down">价格从高到低</option></select>`;
$('#row').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; const k = b.dataset.k; st[k] = st[k] === b.dataset.v ? '' : b.dataset.v; render(); };
$('#sort').onchange = e => { st.sort = e.target.value; render(); };
$('#q').oninput = e => { st.q = e.target.value.trim().toLowerCase(); render(); };
$('#reset').onclick = () => { Object.assign(st, { fam: '', gender: '', season: '', q: '' }); $('#q').value = ''; render(); };

function list() {
  let r = PERFUMES.filter(p =>
    (!st.fam || p.family === st.fam) &&
    (!st.gender || p.gender === st.gender) &&
    (!st.season || p.season.includes(st.season)) &&
    (!st.q || [p.brand, p.name, p.en, p.say, p.top, p.heart, p.base, FAM[p.family].label, ...(p.pick ? p.pick.options : [])].join(' ').toLowerCase().includes(st.q)));
  if (st.sort) r = [...r].sort((a, b) => (minPrice(a) - minPrice(b)) * (st.sort === 'up' ? 1 : -1));
  return r;
}

function render() {
  document.querySelectorAll('.fam').forEach(b => b.classList.toggle('on', b.dataset.f === st.fam));
  document.querySelectorAll('.pill').forEach(b => b.classList.toggle('on', st[b.dataset.k] === b.dataset.v));
  const r = list();
  $('#count').textContent = r.length;
  $('#reset').hidden = !(st.fam || st.gender || st.season || st.q);
  $('#grid').innerHTML = r.length ? r.map((p, i) => `
    <article class="card" data-id="${p.id}" style="animation-delay:${Math.min(i, 12) * 40}ms">
      ${bag.some(x => x.id === p.id) ? '<span class="in">已在小样盒</span>' : ''}
      ${pic(p)}
      <div class="info">
        <div class="brand">${p.brand}</div>
        <div class="name">${p.name}</div>
        <div class="en">${p.en}</div>
        <div class="say">${p.say}</div>
        <div class="tagline">${p.pick ? `${p.pick.options.length} 种味道 · 可单买${p.sizes.some(s => s.mix) ? ` · 可凑 ${p.sizes.filter(s => s.mix).map(s => s.ml).join('/')}ml` : ''}` : `${FAM[p.family].label} · ${p.gender === '中性' ? '中性' : p.gender + '香'} · ${p.season.join('')}`}</div>
      </div>
      <div class="sizes-mini">${p.sizes.map(s => `<span>${s.ml}ml<b>¥${s.price}${s.free ? '<em>包邮</em>' : ''}</b></span>`).join('')}</div>
    </article>`).join('') : `<div class="empty" style="grid-column:1/-1">没有找到合适的，换个条件试试</div>`;
  renderBag();
}

$('#grid').onclick = e => { const c = e.target.closest('.card'); if (c) openDetail(c.dataset.id); };

// 详情
let cur = null, curSize = 0, curPick = [];
function openDetail(id) {
  cur = byId(id); curSize = Math.min(1, cur.sizes.length - 1); curPick = [];
  const p = cur;
  $('#sheet').innerHTML = `
    <div class="grab"></div><button class="x" data-close>×</button>
    <div class="d-top">${pic(p)}<div><div class="brand">${p.brand} · ${p.id}</div><div class="name">${p.name}</div><div class="en">${p.en}</div></div></div>
    <div class="quote">${p.say}</div>
    <div class="tags"><span class="tag">${FAM[p.family].label}</span><span class="tag">${p.gender === '中性' ? '中性' : p.gender + '香'}</span>${p.season.map(s => `<span class="tag">${s}</span>`).join('')}</div>
    ${p.pick ? `<div class="h">先选规格</div>${sizesHtml(p)}
    <div class="h" id="pickH"></div>
    <div class="picks">${p.pick.options.map(o => `<button class="pk" data-pk="${o}">${o}</button>`).join('')}</div>
    <div id="mixWrap"><div class="h"><span id="mixH"></span><b id="pickN"></b></div><div class="mix" id="mix"></div></div>` : `
    <div class="notes">
      <div class="note"><span>前调</span><div>${p.top}</div></div>
      <div class="note"><span>中调</span><div>${p.heart}</div></div>
      <div class="note"><span>后调</span><div>${p.base}</div></div>
    </div>`}
    ${p.pick ? '' : `<div class="h">选择分装规格</div>${sizesHtml(p)}`}
    <div class="acts"><button class="btn line" data-copy1>复制这一款</button><button class="btn dark" data-put>加入小样盒</button></div>`;
  if (p.pick) drawMix();
  open();
}

// 小样盒
function saveBag() { localStorage.setItem('decant-bag', JSON.stringify(bag)); }
function bagTotal() { return bag.reduce((t, x) => t + byId(x.id).sizes[x.s].price, 0); }
function line(x, i) { const p = byId(x.id), s = p.sizes[x.s]; return `${i + 1}. ${p.id} ${p.brand} ${p.name}${picked(x, s)} · ${s.ml}ml ¥${s.price}${free(s)}`; }
function renderBag() {
  bag = bag.filter(x => byId(x.id) && byId(x.id).sizes[x.s] && (!x.pick || typeof x.pick[0] === 'object'));
  $('#bag').classList.toggle('show', bag.length > 0);
  $('#bagN').innerHTML = `小样盒 ${bag.length} 件<small>¥${bagTotal() - cpOff()}</small>`;
}
function openBag() {
  if (!bag.length) { close(); return; }
  $('#sheet').innerHTML = `
    <div class="grab"></div><button class="x" data-close>×</button>
    <div class="d-top"><div><div class="brand">MY SAMPLE BOX</div><div class="name">我的小样盒</div></div></div>
    <div class="bag-list">${bag.map((x, i) => { const p = byId(x.id), s = p.sizes[x.s]; return `
      <div class="bi">${pic(p)}<div class="t"><b>${p.name}</b><div>${p.brand} · ${p.id} · ${s.ml}ml${free(s)}</div>${x.pick ? `<div>${x.pick.map(k => `${k.n} ${k.ml}ml`).join('、')}</div>` : ''}</div><span class="p">¥${s.price}</span><button class="rm" data-rm="${i}">×</button></div>`; }).join('')}</div>
    ${!CP ? '' : !cpGot ? `<div class="cp-row"><span>有一张 ${cpName()} 的优惠券</span><button data-cp>领取</button></div>`
      : cpOff() ? `<div class="cp-row"><span>优惠券 · ${cpName()}</span><b>−¥${CP.off}</b></div>`
      : `<div class="cp-row dim"><span>优惠券 · ${cpName()}</span><span>再挑 ¥${CP.min - bagTotal()} 就能用</span></div>`}
    <div class="total"><span>共 ${bag.length} 件${cpOff() ? ` · 原价 ¥${bagTotal()}` : ''}</span><span>合计 <b>¥${bagTotal() - cpOff()}</b></span></div>
    <div class="acts"><button class="btn dark" data-copyall>复制清单</button></div>
    <div class="hint">复制后回到闲鱼，粘贴发给我<br>我按清单改好价格，你再拍下就好</div>`;
  open();
}
$('#bagOpen').onclick = openBag;

$('#sheet').onclick = e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-close')) close();
  else if (t.dataset.size) {
    curSize = +t.dataset.size; document.querySelectorAll('.size').forEach((b, i) => b.classList.toggle('on', i === curSize));
    if (cur.pick) {
      if (isMix() && curPick.length > cur.pick.max) { curPick = curPick.slice(0, cur.pick.max); toast(`凑一瓶最多 ${cur.pick.max} 种，只留了前 ${cur.pick.max} 种`); }
      split(); drawMix();
    }
  }
  else if (t.dataset.pk) {
    const o = t.dataset.pk, k = curPick.findIndex(x => x.n === o);
    k < 0 ? curPick.push({ n: o, ml: 0 }) : curPick.splice(k, 1);
    split(); drawMix();
  }
  else if (t.dataset.ml) {
    const [i, d] = t.dataset.ml.split(',').map(Number); curPick[i].ml += d; drawMix();
  }
  else if (t.hasAttribute('data-put')) {
    if (cur.pick && !pickOk()) return;
    if (cur.pick && !isMix()) {  // 单买：挑了几种就放几支
      const add = curPick.filter(x => !bag.some(b => b.id === cur.id && b.s === curSize && b.pick[0].n === x.n));
      add.forEach(x => bag.push({ id: cur.id, s: curSize, pick: [{ ...x }] }));
      saveBag(); render(); close(); toast(add.length ? `已放进 ${add.length} 支` : '这几种都已经在小样盒里啦'); return;
    }
    const pk = cur.pick ? curPick.map(x => ({ ...x })) : undefined, same = x => x.id === cur.id && x.s === curSize && JSON.stringify(x.pick || []) === JSON.stringify(pk || []);
    const k = bag.findIndex(same);
    if (k < 0) bag.push({ id: cur.id, s: curSize, pick: pk });
    saveBag(); render(); close(); toast(k < 0 ? '已放进小样盒' : '小样盒里已经有这一支啦');
  }
  else if (t.hasAttribute('data-copy1')) {
    if (cur.pick && !pickOk()) return;
    const s = cur.sizes[curSize], one = pk => `${cur.id} ${cur.brand} ${cur.name}${picked({ pick: pk }, s)} · ${s.ml}ml ¥${s.price}${free(s)}`;
    copy(cur.pick && !isMix() ? `你好～我想要：\n${curPick.map(x => one([x])).join('\n')}\n合计 ¥${s.price * curPick.length}` : `你好～我想要：${one(curPick)}`); }
  else if (t.dataset.rm) { bag.splice(+t.dataset.rm, 1); saveBag(); render(); openBag(); }
  else if (t.hasAttribute('data-cp')) { claimCp(); openBag(); }
  else if (t.hasAttribute('data-copyall')) copy(`你好～我想要这些：\n${bag.map(line).join('\n')}\n` + (cpOff() ? `小计 ¥${bagTotal()}\n优惠券 ${cpName()} −¥${CP.off}\n合计 ¥${bagTotal() - cpOff()}` : `合计 ¥${bagTotal()}`));
};

// 帝门特这类任选系列：单买（每种一支）或凑一瓶（配比，凑满这个规格的毫升数）
const sizesHtml = p => `<div class="sizes">${p.sizes.map((s, i) => `<button class="size ${i === curSize ? 'on' : ''}" data-size="${i}"><b>${s.ml}ml${s.mix ? ' 凑一瓶' : p.pick ? ' 单买' : ''}</b><em>¥${s.price}${free(s)}</em></button>`).join('')}</div>`;
const isMix = () => !!cur.sizes[curSize].mix;
function split() {  // 凑一瓶时把毫升平分：10ml 分 3 种就是 4、3、3；单买每种就是这个规格
  const s = cur.sizes[curSize], n = curPick.length, total = s.mix ? s.ml : 0;
  curPick.forEach((x, i) => x.ml = s.mix ? Math.floor(total / n) + (i < total % n ? 1 : 0) : s.ml);
}
function drawMix() {
  const s = cur.sizes[curSize];
  $('#mixWrap').hidden = !s.mix;
  if (s.mix) $('#mixH').textContent = `配比 · 凑满 ${s.ml}ml`;
  $('#pickH').innerHTML = s.mix ? `挑味道 · 最多 ${cur.pick.max} 种，每种至少 ${cur.pick.min}ml` : `挑味道 · 一种一支，可多选${curPick.length ? `<b>已选 ${curPick.length} 支 ¥${s.price * curPick.length}</b>` : ''}`;
  if (!s.mix) { document.querySelectorAll('.pk').forEach(b => { b.classList.toggle('on', curPick.some(x => x.n === b.dataset.pk)); b.disabled = false; }); return; }
  const { max, min } = cur.pick, total = s.ml, sum = mlSum(curPick), full = curPick.length >= max;
  document.querySelectorAll('.pk').forEach(b => { const on = curPick.some(x => x.n === b.dataset.pk); b.classList.toggle('on', on); b.disabled = full && !on; });
  $('#mix').innerHTML = curPick.map((x, i) => `<div class="mx">${x.n}<span><button data-ml="${i},-1" ${x.ml <= min ? 'disabled' : ''}>−</button><b>${x.ml}ml</b><button data-ml="${i},1" ${sum >= total ? 'disabled' : ''}>+</button></span></div>`).join('');
  const pn = $('#pickN'); pn.textContent = curPick.length ? `已配 ${sum} / ${total}ml` : ''; pn.classList.toggle('ok', sum === total);
}
function pickOk() {
  const total = cur.sizes[curSize].ml, sum = mlSum(curPick);
  if (!curPick.length) { toast('先挑几种味道吧'); return false; }
  if (!isMix()) return true;
  if (sum !== total) { toast(sum < total ? `还差 ${total - sum}ml 凑满 ${total}ml` : `多了 ${sum - total}ml，减掉一点吧`); return false; }
  return true;
}

function open() { $('#mask').classList.add('show'); $('#sheet').classList.add('show'); document.body.classList.add('lock'); }
function close() { $('#mask').classList.remove('show'); $('#sheet').classList.remove('show'); document.body.classList.remove('lock'); }
$('#mask').onclick = close;
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

function copy(text, msg = '已复制 ✓<br>回闲鱼粘贴发给我就好', ms) {
  const ok = () => toast(msg, ms);
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (_) { toast('复制没成功，长按手动复制吧'); } ta.remove(); };
  navigator.clipboard ? navigator.clipboard.writeText(text).then(ok, fallback) : fallback();
}
let tt;
function toast(h, ms = 1800) { const el = $('#toast'); el.innerHTML = h; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), ms); }

// 头图瓶子晃动：弹簧。电脑上跟着鼠标偏，手机上按住左右拖，松手晃两下回正
(() => {
  const hero = $('#hero'), bottle = $('#bottle'), silk = $('#silk'), shadow = $('#shadow'), cotton = $('#cotton'), nudge = $('#nudge');
  let ang = 0, va = 0, ta = 0, x = 0, vx = 0, tx = 0, dragging = false, sx = 0;
  const K = 0.055, D = 0.86, clamp = (v, a) => Math.max(-a, Math.min(a, v));
  (function loop() {
    va = (va + (ta - ang) * K) * D; ang += va;
    vx = (vx + (tx - x) * K) * D; x += vx;
    bottle.style.transform = `translateX(${x.toFixed(2)}px) rotate(${ang.toFixed(3)}deg)`;
    shadow.style.transform = `translateX(${(x * .6).toFixed(2)}px) scaleX(${(1 + Math.abs(ang) * .015).toFixed(3)})`;
    silk.style.transform = `translateX(${(-x * .35).toFixed(2)}px)`;
    cotton.style.transform = `translateX(calc(-50% + ${(-x * .15).toFixed(2)}px))`;
    requestAnimationFrame(loop);
  })();
  hero.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || dragging) return;
    const r = hero.getBoundingClientRect(), rel = clamp((e.clientX - r.left - r.width / 2) / (r.width / 2), 1);
    ta = rel * 5; tx = rel * 14;
  });
  hero.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !dragging) { ta = 0; tx = 0; } });
  bottle.addEventListener('pointerdown', e => { dragging = true; sx = e.clientX; bottle.classList.add('dragging'); bottle.setPointerCapture(e.pointerId); nudge.classList.add('gone'); });
  bottle.addEventListener('pointermove', e => { if (!dragging) return; const dx = e.clientX - sx; ta = clamp(dx / 7, 14); tx = clamp(dx * .35, 34); });
  const end = () => { if (!dragging) return; dragging = false; bottle.classList.remove('dragging'); ta = 0; tx = 0; };
  bottle.addEventListener('pointerup', end); bottle.addEventListener('pointercancel', end);
  setTimeout(() => { va = 2.2; vx = 3; }, 900);
  setTimeout(() => nudge.classList.add('gone'), 6000);
})();

drawCp();
render();
</script>
</body>
</html>
